<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tourist Guide Portal - Book a Tour</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background:
                linear-gradient(
                    rgba(0, 0, 0, 0.45),
                    rgba(0, 0, 0, 0.65)
                ),
                url("https://images.unsplash.com/photo-1588598198321-9735fd524a14?auto=format&fit=crop&w=2000&q=80")
                center / cover fixed;
            color: white;
        }

        /* NAVIGATION */

        nav {
            width: 100%;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;

            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(12px);
        }

        .logo {
            font-size: 23px;
            font-weight: bold;
        }

        .logo span {
            color: #00e5ff;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-size: 14px;
        }

        nav a:hover {
            color: #00e5ff;
        }

        /* MAIN */

        .container {
            min-height: calc(100vh - 75px);

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 40px 20px;
        }

        /* BOOKING CARD */

        .booking-card {
            width: 100%;
            max-width: 560px;

            padding: 35px;

            border-radius: 25px;

            background: rgba(255, 255, 255, 0.10);

            border: 1px solid rgba(255, 255, 255, 0.25);

            backdrop-filter: blur(20px);

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.5);

            animation: slideUp 0.7s ease;
        }

        @keyframes slideUp {

            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* HEADING */

        .heading {
            text-align: center;
            margin-bottom: 28px;
        }

        .heading h1 {
            font-size: 35px;
            margin-bottom: 8px;
        }

        .heading h1 span {
            color: #00e5ff;
        }

        .heading p {
            color: #d6d6d6;
            font-size: 14px;
        }

        /* FORM */

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;

            font-size: 14px;
            font-weight: bold;
        }

        input,
        select {

            width: 100%;

            padding: 14px 15px;

            border: 1px solid rgba(255, 255, 255, 0.25);

            border-radius: 12px;

            background: rgba(0, 0, 0, 0.30);

            color: white;

            font-size: 15px;

            outline: none;

            transition: 0.25s;
        }

        input:focus,
        select:focus {

            border-color: #00e5ff;

            box-shadow:
                0 0 0 3px
                rgba(0, 229, 255, 0.12);
        }

        input::placeholder {
            color: #c6c6c6;
        }

        select option {
            background: #151515;
            color: white;
        }

        /* BUTTON */

        .book-button {

            width: 100%;

            margin-top: 10px;

            padding: 15px;

            border: none;

            border-radius: 13px;

            background:
                linear-gradient(
                    135deg,
                    #00c6ff,
                    #0072ff
                );

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.25s;
        }

        .book-button:hover {

            transform: translateY(-2px);

            box-shadow:
                0 10px 30px
                rgba(0, 114, 255, 0.4);
        }

        .book-button:active {
            transform: scale(0.98);
        }

        .book-button:disabled {

            opacity: 0.6;

            cursor: not-allowed;

            transform: none;
        }

        /* MESSAGE */

        #message {

            display: none;

            margin-top: 18px;

            padding: 13px;

            border-radius: 10px;

            text-align: center;

            font-size: 14px;
        }

        .success {

            display: block !important;

            background:
                rgba(0, 200, 120, 0.18);

            border:
                1px solid
                rgba(0, 255, 150, 0.4);

            color: #7dffc4;
        }

        .error {

            display: block !important;

            background:
                rgba(255, 50, 80, 0.18);

            border:
                1px solid
                rgba(255, 50, 80, 0.4);

            color: #ff9da9;
        }

        /* INFO */

        .database-info {

            margin-top: 25px;

            padding: 15px;

            border-radius: 12px;

            background:
                rgba(0, 0, 0, 0.25);

            text-align: center;

            font-size: 12px;

            color: #cfcfcf;
        }

        .database-info strong {
            color: #00e5ff;
        }

        /* MOBILE */

        @media (max-width: 600px) {

            nav {
                padding: 15px 20px;
            }
