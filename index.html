
<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tourist Guide Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <!-- CSS Link -->  <link rel="stylesheet" href="style.css">  <!-- Font Awesome Icons -->  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"></head>
<body><!-- ===== HEADER ===== --><header>
  <h1>🌍 Tourist Guide Portal</h1>
  <nav>
    <a href="#">Home</a>
    <a href="#booking">Booking</a>
    <a href="#gallery">Gallery</a>
    <a href="#">Login</a>
    <a href="#">Register</a>
  </nav>
</header><!-- ===== HERO SECTION ===== --><section class="hero">
  <div class="overlay">
    <h1>Explore the World ✈️</h1>
    <p>Plan your dream trip with us</p>
    <a href="#booking" class="btn">Book Now</a>
  </div>
</section><!-- ===== BOOKING SECTION ===== --><section id="booking">
  <h2>Book Your Trip</h2>
  <form class="booking-form">
    <input type="text" placeholder="Your Name" required>
    <input type="email" placeholder="Email" required>
    <input type="date" required><select required>
  <option value="">Select Destination</option>
  <option>Goa</option>
  <option>Ooty</option>
  <option>Kashmir</option>
  <option>Kerala</option>
</select>

<button type="submit">Book Now</button>

  </form>
</section><!-- ===== GALLERY SECTION ===== --><section id="gallery">
  <h2>Travel Gallery</h2>
  <div class="gallery">
    <img src="https://source.unsplash.com/300x200/?beach" alt="Beach">
    <img src="https://source.unsplash.com/300x200/?mountain" alt="Mountain">
    <img src="https://source.unsplash.com/300x200/?city" alt="City">
    <img src="https://source.unsplash.com/300x200/?travel" alt="Travel">
  </div>
</section><!-- ===== FOOTER ===== --><footer>
  <p>© 2026 Tourist Guide Portal | Developed by Pujitha</p>
</footer></body>
</html>
