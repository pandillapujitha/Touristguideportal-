<!DOCTYPE html>
<html>
<head>
  <title>Tourist Guide Portal</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>🌍 Tourist Guide Portal</h1>
</header>

<!-- 🔍 SEARCH -->
<section class="search">
  <input type="text" id="placeInput" placeholder="Search place...">
  <button onclick="searchPlace()">Search</button>
</section>

<section id="results"></section>

<!-- 📍 MAP -->
<section>
  <h2>📍 Map</h2>
  <iframe id="map"
    width="100%" height="300"
    style="border:0;" loading="lazy">
  </iframe>
</section>

<!-- 🔐 LOGIN SECTION (ADDED ✅) -->
<section>
  <h2>🔐 Login / Signup</h2>

  <input type="email" id="email" placeholder="Enter Email">
  <input type="password" id="password" placeholder="Enter Password">

  <button onclick="signup()">Signup</button>
  <button onclick="login()">Login</button>
  <button onclick="logout()">Logout</button>

  <p id="user">Not logged in</p>
</section>

<!-- 📅 BOOK -->
<section>
  <h2>📅 Book Guide</h2>

  <input type="text" id="name" placeholder="Your Name">
  <input type="text" id="place" placeholder="Place">

  <button onclick="bookGuide()">Book</button>
</section>

<!-- ✅ CORRECT Firebase Scripts -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

<!-- Your Files -->
<script src="firebase.js"></script>
<script src="script.js"></script>

</body>
</html>
