
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Tourist Guide Portal</title>
<link rel="stylesheet" href="style.css">

<style>
.login-box{
    width:350px;
    margin:80px auto;
    background:#fff;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.2);
}

.login-box h2{
    text-align:center;
    margin-bottom:20px;
}

.login-box input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:5px;
}

.login-box button{
    width:100%;
    padding:12px;
    background:#0d6efd;
    color:#fff;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

.login-box button:hover{
    background:#084298;
}

.login-box p{
    text-align:center;
    margin-top:15px;
}
</style>

</head>

<body>

<header>
<h1>Tourist Guide Portal</h1>

<nav>
<a href="index.html">Home</a>
<a href="register.html">Register</a>
<a href="booking.html">Book Tour</a>
</nav>
</header>

<div class="login-box">

<h2>User Login</h2>

<form>

<input type="email" placeholder="Enter Email" required>

<input type="password" placeholder="Enter Password" required>

<button type="submit">Login</button>

<p>
Don't have an account?
<a href="register.html">Register</a>
</p>

</form>

</div>

</body>
</html>
