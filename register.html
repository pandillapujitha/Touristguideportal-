
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - Tourist Guide Portal</title>
<link rel="stylesheet" href="style.css">

<style>
.register-box{
    width:400px;
    margin:60px auto;
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}

.register-box h2{
    text-align:center;
    margin-bottom:20px;
}

.register-box input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:5px;
}

.register-box button{
    width:100%;
    padding:12px;
    background:#0d6efd;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
    font-size:16px;
}

.register-box button:hover{
    background:#084298;
}

.register-box p{
    text-align:center;
    margin-top:15px;
}
</style>

</head>

<body>

<header>

<h1>Tourist Guide Portal</h1>

<nav>
<a href="index.html">Home</a>
<a href="login.html">Login</a>
<a href="booking.html">Book Tour</a>
</nav>

</header>

<div class="register-box">

<h2>Create Account</h2>

<form>

<input type="text" placeholder="Full Name" required>

<input type="email" placeholder="Email Address" required>

<input type="tel" placeholder="Phone Number" required>

<input type="password" placeholder="Password" required>

<input type="password" placeholder="Confirm Password" required>

<button type="submit">Register</button>

<p>Already have an account?
<a href="login.html">Login</a>
</p>

</form>

</div>

</body>
</html>
